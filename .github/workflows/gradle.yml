# Compila en cada push y pull request a main. Al subir una etiqueta `v*` (por ejemplo v1.0.1) publica ademas una
# release con los .jar y sus .sha1: ColibriMC descarga siempre la ultima, asi un parche llega a los servidores al reiniciar.
name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Make the Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Checksums
      run: |
        cd build/libs
        for f in *.jar; do sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"; done

    - name: Keep the jars for the release
      uses: actions/upload-artifact@v4
      with:
        name: adapters
        path: |
          build/libs/*.jar
          build/libs/*.jar.sha1

  release:

    # Solo al subir una etiqueta v*. 
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: adapters
        path: release

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
